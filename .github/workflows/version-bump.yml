name: Version bump & build launcher

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.txt'
      - 'Update Game.exe'
      - '.github/**'

permissions:
  contents: write

jobs:
  bump-and-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment version.txt
        id: ver
        shell: bash
        run: |
          V=$(cat version.txt 2>/dev/null || echo 0)
          NEW=$((V + 1))
          echo $NEW > version.txt
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped to v$NEW"

      - name: Build Update Game.exe
        shell: cmd
        run: |
          "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" ^
            /target:exe ^
            /reference:System.Windows.Forms.dll ^
            /reference:System.IO.Compression.dll ^
            /reference:System.IO.Compression.FileSystem.dll ^
            /out:"Update Game.exe" ^
            UpdaterSrc.cs

      - name: Commit & push
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "Update Game.exe"
          git diff --cached --quiet || {
            git commit -m "v${{ steps.ver.outputs.new }} [skip ci]"
            git push
          }
