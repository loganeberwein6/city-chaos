name: Build Run Game.exe

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Run Game.exe'
      - '.github/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Run Game.exe
        shell: bash
        run: |
          dotnet build launcher/rungame.csproj -c Release -o build/rungame
          cp "build/rungame/Run Game.exe" "Run Game.exe"

      - name: Commit & push
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Run Game.exe"
          git diff --cached --quiet || {
            git commit -m "build: update Run Game.exe [skip ci]"
            git push
          }
