name: Version bump & build launcher

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.txt'
      - 'Update Game.exe'
      - 'Run Game.exe'
      - '.github/**'

permissions:
  contents: write

jobs:
  bump-and-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment version.txt
        id: ver
        shell: bash
        run: |
          V=$(cat version.txt 2>/dev/null || echo 0)
          NEW=$((V + 1))
          echo $NEW > version.txt
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped to v$NEW"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Update Game.exe
        shell: bash
        run: |
          dotnet build launcher/launcher.csproj -c Release -o build/updater
          cp "build/updater/Update Game.exe" "Update Game.exe"

      - name: Build Run Game.exe
        shell: bash
        run: |
          dotnet build launcher/rungame.csproj -c Release -o build/rungame
          cp "build/rungame/Run Game.exe" "Run Game.exe"

      - name: Commit & push
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "Update Game.exe" "Run Game.exe"
          git diff --cached --quiet || {
            git commit -m "v${{ steps.ver.outputs.new }} [skip ci]"
            git push
          }
